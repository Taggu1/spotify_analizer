services:
  postgres:
    image: postgres:16
    container_name: spotify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_ID: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgressql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spotify" ]
      interval: 5s
      retries: 5
volumes:
  pgdata:
